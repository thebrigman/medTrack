<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/layout :: head('Log dose')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('requests')}"></header>

<main class="narrow">
    <p class="crumbs"><a th:href="@{/ui/requests}">Active requests</a> / Log dose</p>
    <h1>Log a dose</h1>

    <!-- What was ordered: fixed, comes from the MedicationRequest -->
    <div class="card order">
        <dl class="details">
            <dt>Patient</dt>
            <dd><strong><span th:replace="~{fragments/layout :: person(${request.patient})}"></span></strong></dd>

            <dt>Medication</dt>
            <dd><strong><span th:replace="~{fragments/layout :: medication(${request.medication})}"></span></strong></dd>

            <dt>Instructions</dt>
            <dd th:text="${request.dosageInstruction} ?: '—'"></dd>

            <dt>Order</dt>
            <dd>
                <code th:text="${request.fhirId}"></code>
                <span class="muted" th:text="'· ordered ' + (${request.authoredOn} ?: '—') + ' · ' + (${request.priority} ?: 'routine')"></span>
            </dd>
        </dl>
    </div>

    <div class="notice notice-error" th:if="${error}" th:text="${error}" role="alert"></div>

    <!-- What was given -->
    <form class="card form" method="post"
          th:action="@{/ui/requests/{id}/log(id=${request.fhirId})}" th:object="${form}">

        <div class="row">
            <label class="field">
                <span>Dose</span>
                <input type="number" th:field="*{dosageQuantity}" step="any" min="0" required>
            </label>
            <label class="field">
                <span>Unit</span>
                <input type="text" th:field="*{dosageUnit}" placeholder="mg" required>
            </label>
        </div>

        <label class="field">
            <span>Route</span>
            <select th:field="*{routeCode}" required>
                <option th:each="r : ${routes}" th:value="${r.key}" th:text="${r.value}"></option>
            </select>
        </label>

        <label class="field">
            <span>Time given</span>
            <input type="datetime-local" th:field="*{effectiveDateTime}" required>
        </label>

        <label class="field">
            <span>Given by</span>
            <select th:field="*{practitionerFhirId}" required>
                <option value="">Choose…</option>
                <option th:each="p : ${practitioners}" th:value="${p.fhirId}"
                        th:text="${p.givenName} + ' ' + ${p.familyName} + (${p.qualification != null} ? ' (' + ${p.qualification} + ')' : '')"></option>
            </select>
        </label>

        <div class="form-actions">
            <button type="submit" class="button">Record administration</button>
            <a th:href="@{/ui/requests}">Cancel</a>
        </div>
    </form>

    <!-- Earlier doses of this medication for this patient, to help avoid a double dose -->
    <section class="history">
        <h2>Previous doses of this medication</h2>
        <p class="muted" th:if="${#lists.isEmpty(history)}">None recorded for this patient.</p>
        <div class="table-wrap" th:unless="${#lists.isEmpty(history)}">
            <table>
                <thead>
                <tr><th>Given</th><th>Dose</th><th>Route</th><th>Given by</th></tr>
                </thead>
                <tbody>
                <tr th:each="h : ${history}">
                    <td><a class="nowrap" th:href="@{/ui/administrations/{id}(id=${h.fhirId})}" th:text="${@fmt.time(h.effectiveDateTime)}"></a></td>
                    <td class="nowrap" th:text="${h.dosageQuantity != null} ? ${@fmt.num(h.dosageQuantity)} + ' ' + ${h.dosageUnit} : '—'"></td>
                    <td th:text="${h.dosageRoute} ?: '—'"></td>
                    <td><span th:replace="~{fragments/layout :: person(${h.practitioner})}"></span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
